# Traducción de los ProblemDetail que genera el propio Spring para sus excepciones.
#
# Spring busca los códigos "problemDetail.<clase>" y "problemDetail.title.<clase>" en el
# MessageSource, que Spring Boot autoconfigura al encontrar este archivo. Sin él, esas respuestas
# salen en inglés ("Invalid request content.", "Bad Request"), que es lo que acaba viendo el usuario
# cuando el error no lo genera código nuestro.
#
# Spring Boot lee este archivo como UTF-8, así que las tildes van directamente.
problemDetail.title.org.springframework.web.bind.MethodArgumentNotValidException=Datos inválidos
problemDetail.org.springframework.web.bind.MethodArgumentNotValidException=Revisa los campos indicados en la propiedad «errores».

problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Cuerpo ilegible
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=El cuerpo de la petición falta o no es JSON válido.

problemDetail.title.org.springframework.web.HttpRequestMethodNotSupportedException=Método no permitido
problemDetail.org.springframework.web.HttpRequestMethodNotSupportedException=Esa operación no está permitida en esta dirección.

problemDetail.title.org.springframework.web.HttpMediaTypeNotSupportedException=Formato no admitido
problemDetail.org.springframework.web.HttpMediaTypeNotSupportedException=El contenido debe enviarse en formato JSON.

problemDetail.title.org.springframework.web.servlet.resource.NoResourceFoundException=Recurso no encontrado
problemDetail.org.springframework.web.servlet.resource.NoResourceFoundException=La dirección solicitada no existe.
