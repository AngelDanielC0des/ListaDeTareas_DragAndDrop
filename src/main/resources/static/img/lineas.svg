<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" preserveAspectRatio="none" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#059669" stop-opacity=".5"/>
      <stop offset="1" stop-color="#84cc16" stop-opacity=".35"/>
    </linearGradient>
    <pattern id="p" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#ffffff" stroke-width="3" opacity=".22"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#g)"/>
  <rect width="400" height="300" fill="url(#p)"/>
</svg>
