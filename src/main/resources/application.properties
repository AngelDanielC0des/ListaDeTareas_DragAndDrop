spring.application.name=tareas

# Archivos donde se persisten los datos. Relativos al directorio desde el que se arranca la app.
#
# El fondo de cada tarjeta va en su propio archivo a propósito: así tareas.json conserva
# exactamente los tres campos de una tarea y no se mezcla la decoración con los datos.
app.almacen.ruta=datos/tareas.json
app.almacen.ruta-de-fondos=datos/fondos.json

# NO hace falta spring.mvc.problemdetails.enabled: esa propiedad activa el manejador de errores de
# Spring Boot, y ManejadorErroresGlobal ya extiende ResponseEntityExceptionHandler, con lo que la
# autoconfiguracion de Boot se aparta sola (@ConditionalOnMissingBean) y es el nuestro el que
# responde en formato ProblemDetail, tambien para los 405, 415 y 404 de recurso.
#
# Los textos de esas excepciones del framework se traducen al español en messages.properties.
