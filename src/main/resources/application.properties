spring.application.name=tareas

# Archivo donde se persisten las tareas. Relativo al directorio desde el que se arranca la app.
app.almacen.ruta=datos/tareas.json

# Que las excepciones propias de Spring MVC (405, 415, 404 de recurso...) respondan también en
# formato ProblemDetail, para que el frontend tenga un único formato de error que interpretar.
# Sus textos se traducen al español en messages.properties.
#
# OJO: para que esto funcione de verdad, ManejadorErroresGlobal NO puede tener un
# @ExceptionHandler(Exception.class); si lo tuviera, al ir con prioridad alta se tragaría estos
# casos y los convertiría en 500. Hay tests que cubren el 405 y el 415 para que no vuelva a pasar.
spring.mvc.problemdetails.enabled=true
