spring.application.name=tareas

# Archivos donde se persisten los datos. Relativos al directorio desde el que se arranca la app.
#
# El fondo y el grupo de cada tarea van en sus propios archivos a propósito: así tareas.json
# conserva exactamente los tres campos de una tarea. Los grupos y sus asignaciones comparten archivo
# porque por separado no sirven de nada y dos escrituras podrían dejar asignaciones sin grupo.
app.almacen.ruta=datos/tareas.json
app.almacen.ruta-de-fondos=datos/fondos.json
app.almacen.ruta-de-grupos=datos/grupos.json

# NO hace falta spring.mvc.problemdetails.enabled: esa propiedad activa el manejador de errores de
# Spring Boot, y ManejadorErroresGlobal ya extiende ResponseEntityExceptionHandler, con lo que la
# autoconfiguracion de Boot se aparta sola (@ConditionalOnMissingBean) y es el nuestro el que
# responde en formato ProblemDetail, tambien para los 405, 415 y 404 de recurso.
#
# Los textos de esas excepciones del framework se traducen al español en messages.properties.

# La documentación de la API se expone A PROPÓSITO: es la forma de que alguien pueda leer y probar
# los endpoints sin instalarse nada, y en este proyecto eso es una funcionalidad, no un descuido.
#
# Se declaran las dos aunque su valor sea el de por defecto: springdoc avisa por consola en cada
# arranque de que están activas «por si acaso», y ponerlas explícitamente es la manera de decir que
# la decisión está tomada. En un servicio con datos de verdad, aquí iría «false».
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
