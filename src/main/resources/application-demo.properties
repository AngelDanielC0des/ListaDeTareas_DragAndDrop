# Perfil de la demostración pública: arrancar con  --spring.profiles.active=demo
#
# Solo cambia dos cosas respecto al arranque normal: siembra tareas de ejemplo (lo hace
# DatosDeDemostracion, que solo existe con este perfil) y baja el detalle del log, porque en un
# servidor gratuito los registros se cobran en espacio y en atención.
logging.level.angel.xtd.tareas=INFO
logging.level.org.springframework.web=WARN

# NO se pone aquí ningún límite de tamaño de cuerpo, y conviene explicar por qué: las propiedades
# que uno buscaría no sirven para esto. spring.servlet.multipart.* solo aplica a subidas de archivos
# —que esta aplicación no tiene— y server.tomcat.max-swallow-size limita lo que Tomcat descarta de
# un cuerpo que nadie lee, no lo que acepta. Ponerlas daría una falsa sensación de protección.
#
# Lo que de verdad acota el único endpoint que recibe una lista sin tamaño fijo es
# validarQueEsPermutacionExacta: exige que los ids sean exactamente los que hay, así que una lista
# enorme se rechaza con un 409 sin llegar a aplicarse.

# Detrás del proxy del proveedor (Fly.io, Render...) la aplicación necesita fiarse de las cabeceras
# X-Forwarded-* para que las URL que genera lleven https y no http.
server.forward-headers-strategy=native
